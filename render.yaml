services:
  - type: web
    name: competitive-exam-command-center
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: competitive-exam-command-center-db
          property: connectionString

databases:
  - name: competitive-exam-command-center-db
    plan: free
    databaseName: examforge
    user: examforge
